version: 2

# Officewrite is an npm workspace monorepo: the real dependencies live in
# apps/desktop and packages/*, but a single package-lock.json at the root
# resolves them all. Dependabot follows that lockfile from "/", so one npm
# entry covers every workspace.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Most of what gets flagged here (nanoid, @babel/core, linkify-it) is
    # transitive. Security-only jobs refuse to touch subdependencies and error
    # out instead; scheduled version updates refresh the whole lockfile, which
    # is what actually clears those advisories.
    versioning-strategy: increase-if-necessary
    groups:
      # One PR per weekly sweep rather than ten, so the regression suite runs
      # once against the combined tree.
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Electron majors drag Chromium and the packaging chain with them, and
      # release.yml builds a signed Windows installer off this. Bump it
      # deliberately, not on a Monday morning.
      - dependency-name: electron
        update-types:
          - version-update:semver-major

  # The regression logs warn that checkout@v4, setup-node@v4 and
  # upload-artifact@v4 still target the deprecated Node 20 runtime.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
